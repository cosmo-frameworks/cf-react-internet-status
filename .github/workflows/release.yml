name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing reaches npm without passing the exact checks a PR has to pass.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Must be at least as new as the npm that writes the lockfile locally,
          # or `npm install --package-lock-only` silently drops fields it does
          # not know about (npm 10 strips the `libc` entries npm 11 writes).
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - uses: changesets/action@v2
        with:
          # These inputs are not run through a shell, so `&&` would be passed to
          # the command as an argument. The lockfile refresh that has to follow
          # `changeset version` lives in the `version-packages` script instead.
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `changeset publish` does not forward the --provenance flag, so it
          # has to be set through the environment.
          NPM_CONFIG_PROVENANCE: 'true'
