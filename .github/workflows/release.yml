name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing reaches npm without passing the exact checks a PR has to pass.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - uses: changesets/action@v1
        with:
          # `changeset version` only bumps package.json, so the lockfile has to
          # be refreshed or it keeps reporting the previous version forever.
          version: npx changeset version && npm install --package-lock-only
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `changeset publish` does not forward the --provenance flag, so it
          # has to be set through the environment.
          NPM_CONFIG_PROVENANCE: 'true'
